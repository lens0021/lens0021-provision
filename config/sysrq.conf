# Raise SysRq from Fedora's default of 16 (sync only) to the full set.
# The compositor freezes on this machine leave sysrq as the only kernel-level
# escape, and gnome-shell-watchdog needs w and t to dump state before it
# restarts gdm. The key itself cannot be typed here: PrtScr is Fn+F10 and the
# embedded controller suppresses other keys while Fn is held.
kernel.sysrq = 1
